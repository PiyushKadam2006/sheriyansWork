<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Stop watch</h1>

    <main>
      <div>
        <h1 id="hrs">00</h1>
        <p>Hrs</p>
      </div>
      <span>:</span>
      <div>
        <h1 id="mins">00</h1>
        <p>Mins</p>
      </div>
      <span>:</span>
      <div>
        <h1 id="secs">00</h1>
        <p>Secs</p>
      </div>
      <div>
        <h1 id="milisecs">00</h1>
        <p>milisecs</p>
      </div>
    </main>

    <button id="strbtn">Start</button>
    <button id="stpbtn">Stop</button>
    <button id="rstbtn">Reset</button>

    <script src="app.js"></script>
  </body>
</html>
